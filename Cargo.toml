[package]
name = "voxanth-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voxanth interactive egui browser voice laboratory"

[lib]
path = "crates/voxanth-studio/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
voxanth-core = { path = "crates/voxanth-core" }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "console"] }

[workspace]
members = ["crates/voxanth-core"]
default-members = ["crates/voxanth-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Salvador Guzman"]
repository = "https://github.com/sguzman/voxanth"
