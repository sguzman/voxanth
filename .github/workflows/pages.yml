name: Test and publish Voxanth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test synthesis core and independent audio bridge
        run: |
          cargo test -p voxanth-core
          cargo test -p voxanth-web-audio
      - name: Install Trunk (prebuilt, checksum verified)
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: Build egui/WASM site
        run: trunk build --release --public-url /voxanth/
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - name: Build standalone Rust audio module
        run: |
          cargo build --release --target wasm32-unknown-unknown -p voxanth-web-audio
          mkdir -p dist/engine
          wasm-bindgen --target web --no-typescript --out-dir dist/engine target/wasm32-unknown-unknown/release/voxanth_web_audio.wasm
          test -s dist/engine/voxanth_web_audio.js
          test -s dist/engine/voxanth_web_audio_bg.wasm
      - name: Check browser JavaScript syntax
        run: |
          node --check fallback.js
          node --check --input-type=module < compat-engine.js
          node --check crates/voxanth-studio/src/audio_bridge.js
      - name: Install Chrome for browser smoke tests
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Smoke-test real Rust/WASM in browser without WebGL
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/voxanth-preview/voxanth
          cp -a dist/. /tmp/voxanth-preview/voxanth/
          python3 -m http.server 8876 --bind 127.0.0.1 --directory /tmp/voxanth-preview > /tmp/voxanth-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8876/voxanth/ >/dev/null && break
            sleep 1
          done
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --disable-webgl --virtual-time-budget=15000 \
            --dump-dom "http://127.0.0.1:8876/voxanth/?voxanth-smoke=1" \
            > /tmp/voxanth-browser.html 2>/tmp/voxanth-chrome.log || {
              cat /tmp/voxanth-chrome.log
              exit 1
            }
          grep -q 'data-voxanth-smoke="passed"' /tmp/voxanth-browser.html || {
            echo "FAIL: Rust DSP sample generation did not run in Chrome"
            tail -90 /tmp/voxanth-browser.html
            exit 1
          }
          grep -q 'data-voxanth-studio="compatibility"' /tmp/voxanth-browser.html || {
            echo "FAIL: no-WebGL compatibility UI never became visible"
            tail -90 /tmp/voxanth-browser.html
            exit 1
          }
          # Simulate broken egui script loading, keeping standalone Rust audio.
          mkdir -p /tmp/voxanth-broken-egui
          mv /tmp/voxanth-preview/voxanth/voxanth-studio-*.js /tmp/voxanth-broken-egui/
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --disable-webgl --virtual-time-budget=15000 \
            --dump-dom "http://127.0.0.1:8876/voxanth/?voxanth-smoke=1" \
            > /tmp/voxanth-blocked-studio.html 2>/tmp/voxanth-blocked-studio-chrome.log || {
              cat /tmp/voxanth-blocked-studio-chrome.log
              exit 1
            }
          grep -q 'data-voxanth-smoke="passed"' /tmp/voxanth-blocked-studio.html || {
            echo "FAIL: standalone Rust audio didn't survive a failed egui import"
            tail -90 /tmp/voxanth-blocked-studio.html
            exit 1
          }
          grep -q 'data-voxanth-studio="compatibility"' /tmp/voxanth-blocked-studio.html || {
            echo "FAIL: studio failure didn't activate compatibility UI"
            exit 1
          }
      - name: Install Firefox Developer Edition
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-devedition
      - name: Install geckodriver
        uses: browser-actions/setup-geckodriver@latest
      - name: Verify standalone audio in Firefox with egui blocked
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          set -euo pipefail
          "$FIREFOX_BIN" --version
          python3 -m http.server 8876 --bind 127.0.0.1 --directory /tmp/voxanth-preview > /tmp/voxanth-firefox-server.log 2>&1 &
          SERVER_PID=$!
          geckodriver --port 4444 > /tmp/voxanth-geckodriver.log 2>&1 &
          GECKO_PID=$!
          trap 'kill "$SERVER_PID" "$GECKO_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4444/status >/dev/null; then break; fi
            sleep 1
          done
          PAYLOAD=$(jq -nc --arg binary "$FIREFOX_BIN"             '{capabilities:{alwaysMatch:{browserName:"firefox","moz:firefoxOptions":{binary:$binary,args:["-headless"]}}}}')
          SESSION=$(curl -fsS -H "Content-Type: application/json"             -d "$PAYLOAD" http://127.0.0.1:4444/session | jq -r '.value.sessionId')
          test "$SESSION" != "null" && test -n "$SESSION"
          trap 'curl -fsS -X DELETE "http://127.0.0.1:4444/session/$SESSION" >/dev/null 2>&1 || true; kill "$SERVER_PID" "$GECKO_PID" 2>/dev/null || true' EXIT
          curl -fsS -H "Content-Type: application/json"             -d '{"url":"http://127.0.0.1:8876/voxanth/?voxanth-smoke=1"}'             "http://127.0.0.1:4444/session/$SESSION/url" >/dev/null
          SCRIPT='{"script":"return {smoke:document.documentElement.dataset.voxanthSmoke,mode:document.documentElement.dataset.voxanthStudio,engine:typeof window.voxanthAudioRender};","args":[]}'
          PASS=0
          for attempt in $(seq 1 30); do
            RESULT=$(curl -fsS -H "Content-Type: application/json" -d "$SCRIPT"               "http://127.0.0.1:4444/session/$SESSION/execute/sync")
            echo "$RESULT"
            if echo "$RESULT" | jq -e '.value | .smoke=="passed" and .mode=="compatibility" and .engine=="function"' >/dev/null; then
              PASS=1
              break
            fi
            sleep 1
          done
          if [ "$PASS" != "1" ]; then
            echo "Firefox Developer Edition could not load independent Rust audio"
            cat /tmp/voxanth-geckodriver.log
            exit 1
          fi
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
