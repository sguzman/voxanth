[package]
name = "voxanth-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voxanth interactive egui browser voice laboratory"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voxanth-core = { path = "../voxanth-core" }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "console"] }
